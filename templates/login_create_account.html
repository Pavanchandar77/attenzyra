{% extends "base.html" %}
{% block title %}Create {{ account_type }} ID{% endblock %}
{% block content %}
<div class="login-page">
  <div class="login-card">
    <h1>Create {{ account_type }} ID</h1>
    <p class="subtitle">Create a separate login for your selected school.</p>
    <form method="POST" autocomplete="off">
      <div class="form-group"><label>School</label><select name="school_slug" required><option value="">-- Select School --</option>{% for school in school_list %}<option value="{{ school['slug'] }}">{{ school['name'] }}</option>{% endfor %}</select></div>
      {% if account_type == 'Teacher' %}
      <div class="form-group"><label>Teacher Name</label><input name="full_name" required></div>
      <div class="form-group"><label>New Teacher Username</label><input name="username" required></div>
      <div class="form-group"><label>Email</label><input name="email" type="email"></div>
      {% else %}
      <div class="form-group"><label>Admission Number / Student ID</label><input name="admission_no" required></div>
      <div class="form-group"><label>Student Name</label><input name="name" required></div>
      <div class="form-group"><label>Class</label><input name="class_name" required placeholder="Class A"></div>
      <div class="form-group"><label>New Student Username</label><input name="username" required></div>
      {% endif %}
      <div class="form-group"><label>Password</label><input name="password" type="password" minlength="6" required></div>
      <div class="form-group"><label>Confirm Password</label><input name="confirm_password" type="password" minlength="6" required></div>
      <button class="primary-button full-button" type="submit">CREATE {{ account_type|upper }} ID</button>
    </form>
    <p class="login-links"><a href="{{ url_for('login') }}">← Back to Login</a></p>
  </div>
</div>
{% endblock %}
