{% extends "base.html" %}
{% block title %}Forgot Password | ATTENZYRA{% endblock %}
{% block content %}
<div class="login-page"><div class="login-card">
<h1>Forgot Password?</h1><p class="subtitle">Reset your ATTENZYRA account</p>
<form method="POST">
<div class="form-group"><label>Username / Admission No. / Registered Email</label><input type="text" name="username" required></div>
<button class="primary-button full-button" type="submit">SEND RESET LINK</button>
</form>
<p class="login-note"><a href="{{ url_for('login') }}">Back to Login</a></p>
</div></div>
{% endblock %}
