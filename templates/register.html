{% extends "base.html" %}
{% block title %}Create Account | ATTENZYRA{% endblock %}
{% block content %}
<div class="login-page"><div class="login-card">
<h1>Create Account</h1><p class="subtitle">Teacher / Admin Account</p>
<form method="POST">
<div class="form-group"><label>Username</label><input type="text" name="username" required></div>
<div class="form-group"><label>Gmail / Email</label><input type="email" name="email" required></div>
<div class="form-group"><label>Account Type</label><select name="role" required><option value="teacher">Teacher</option><option value="admin">Admin</option></select></div>
<div class="form-group"><label>Password</label><input type="password" name="password" minlength="6" required></div>
<div class="form-group"><label>Confirm Password</label><input type="password" name="confirm_password" minlength="6" required></div>
<button class="primary-button full-button" type="submit">CREATE ACCOUNT</button>
</form>
<p class="login-note"><a href="{{ url_for('login') }}">Back to Login</a></p>
</div></div>
{% endblock %}
