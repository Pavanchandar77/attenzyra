{% extends "base.html" %}

{% block title %}
Change Password | ATTENZYRA
{% endblock %}

{% block content %}

<div class="page-header">

    <div>

        <h1>
            Change Password
        </h1>

        <p>
            Keep your student account secure.
        </p>

    </div>

</div>


<div class="student-form-card password-card">

    <form method="POST">

        <div class="form-group">

            <label>
                Current Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    name="current_password"
                    class="password-field"
                    required
                >

                <button
                    type="button"
                    class="show-password toggle-field"
                >
                    Show
                </button>

            </div>

        </div>


        <div class="form-group">

            <label>
                New Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    name="new_password"
                    class="password-field"
                    required
                    minlength="6"
                >

                <button
                    type="button"
                    class="show-password toggle-field"
                >
                    Show
                </button>

            </div>

        </div>


        <div class="form-group">

            <label>
                Confirm New Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    name="confirm_password"
                    class="password-field"
                    required
                    minlength="6"
                >

                <button
                    type="button"
                    class="show-password toggle-field"
                >
                    Show
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="primary-button full-button"
        >
            CHANGE PASSWORD
        </button>

    </form>

</div>

{% endblock %}
