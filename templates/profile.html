{% extends "base.html" %}{% block title %}Profile{% endblock %}{% block content %}
<h1>Profile</h1><div class="card"><h2>{{ profile['full_name'] if role!='student' else profile['name'] }}</h2><p>Role: {{ role }}</p>{% if profile['photo'] %}<img src="{{ url_for('static',filename='uploads/profiles/'+profile['photo']) }}" style="max-width:180px;max-height:180px;border-radius:50%">{% endif %}</div>
<form method="POST" enctype="multipart/form-data" class="form-card"><label>Profile photo</label><input type="file" name="photo" accept="image/*" required><button class="primary-button">Upload Photo</button></form>{% endblock %}
