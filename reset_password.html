{% extends "base.html" %}
{% block title %}Reset Password | ATTENZYRA{% endblock %}
{% block content %}
<div class="login-page"><div class="login-card">
<h1>Reset Password</h1><p class="subtitle">Choose a new password</p>
<form method="POST">
<div class="form-group"><label>New Password</label><input type="password" name="password" minlength="6" required></div>
<div class="form-group"><label>Confirm Password</label><input type="password" name="confirm_password" minlength="6" required></div>
<button class="primary-button full-button" type="submit">RESET PASSWORD</button>
</form>
</div></div>
{% endblock %}
